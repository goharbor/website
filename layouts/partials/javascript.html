{{ $alpineJsVersion := site.Params.alpine_js_version }}
<script src="https://cdn.jsdelivr.net/npm/alpinejs@{{ $alpineJsVersion }}/dist/cdn.min.js" defer></script>

{{/* Anchor link scroll offset */}}
<script>
  const navbarHeight = document.getElementsByClassName('navbar')[0].offsetHeight;
  const extraPadding = 15;
  const navbarOffset = -1 * (navbarHeight + extraPadding);
  var shiftWindow = function() { scrollBy(0, navbarOffset) };
  window.addEventListener("hashchange", shiftWindow);
  window.addEventListener("pageshow", shiftWindow);
  function load() { if (window.location.hash) shiftWindow(); }

  console.log("OK");
</script>
<script src="/js/table-popout.js"></script>
